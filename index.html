<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application d'Intervalles - Jogging</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-run: #ff5252;
      --accent-walk: #4caf50;
      --text-color: #ffffff;
      --subtext-color: #b0b0b0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .timer-display {
      font-size: 4.5rem;
      font-weight: bold;
      margin: 1rem 0;
      font-variant-numeric: tabular-nums;
    }

    .phase-indicator {
      font-size: 1.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
    }

    .phase-run {
      color: var(--accent-run);
      background-color: rgba(255, 82, 82, 0.15);
    }

    .phase-walk {
      color: var(--accent-walk);
      background-color: rgba(76, 175, 80, 0.15);
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 2rem;
      justify-content: center;
    }

    button {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.96);
    }

    button.btn-primary {
      background-color: #388e3c;
    }

    button.btn-stop {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Entraînement d'Intervalles</h1>

    <div id="phaseDisplay" class="phase-indicator phase-run">Course</div>
    <div id="timerDisplay" class="timer-display">00:30</div>

    <div class="controls">
      <button id="btnStart" class="btn-primary">Démarrer</button>
      <button id="btnReset" class="btn-stop" style="display: none;">Arrêter</button>
    </div>
  </div>

  <script>
    // Config de l'entraînement (en secondes)
    const DURATION_RUN = 30;
    const DURATION_WALK = 30;

    let currentPhase = 'RUN'; // 'RUN' ou 'WALK'
    let timeLeft = DURATION_RUN;
    let timerInterval = null;
    let wakeLock = null;
    let countdownTriggered = false;

    // Éléments DOM
    const timerDisplay = document.getElementById('timerDisplay');
    const phaseDisplay = document.getElementById('phaseDisplay');
    const btnStart = document.getElementById('btnStart');
    const btnReset = document.getElementById('btnReset');

    // Context Web Audio pour la gestion du gain (+3 dB sur cloche.wav)
    let audioCtx = null;
    let clocheBuffer = null;
    let decompteBuffer = null;
    let clocheGainNode = null;

    // Facteur +3 dB : 10^(3/20) ≈ 1.4125
    const GAIN_3DB = Math.pow(10, 3 / 20);

    // Initialisation et chargement de l'audio via Web Audio API
    async function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        // Création du noeud de Gain pour booster la cloche de +3 dB
        clocheGainNode = audioCtx.createGain();
        clocheGainNode.gain.value = GAIN_3DB;
        clocheGainNode.connect(audioCtx.destination);
      }

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      // Préchargement des fichiers
      if (!clocheBuffer) {
        clocheBuffer = await loadAudioBuffer('cloche.wav');
      }
      if (!decompteBuffer) {
        decompteBuffer = await loadAudioBuffer('decompte_5s.wav');
      }
    }

    async function loadAudioBuffer(url) {
      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        return await audioCtx.decodeAudioData(arrayBuffer);
      } catch (err) {
        console.error(`Erreur de chargement du fichier audio (${url}) :`, err);
        return null;
      }
    }

    // Jouer le décompte (1 seul bloc audio de 5 secondes)
    function playDecompte() {
      if (!audioCtx || !decompteBuffer) return;
      
      const source = audioCtx.createBufferSource();
      source.buffer = decompteBuffer;
      // Connexion directe à la sortie standard (volume 1.0)
      source.connect(audioCtx.destination);
      source.start(0);
    }

    // Jouer la cloche avec le boost de +3 dB
    function playCloche() {
      if (!audioCtx || !clocheBuffer) return;

      const source = audioCtx.createBufferSource();
      source.buffer = clocheBuffer;
      // Routage dans le GainNode (+3 dB)
      source.connect(clocheGainNode);
      source.start(0);
    }

    // Empêcher le verrouillage de l'écran (Screen Wake Lock API)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock non disponible :', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    // Formater le temps M:SS
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateUI() {
      timerDisplay.textContent = formatTime(timeLeft);
      if (currentPhase === 'RUN') {
        phaseDisplay.textContent = 'Course';
        phaseDisplay.className = 'phase-indicator phase-run';
      } else {
        phaseDisplay.textContent = 'Marche';
        phaseDisplay.className = 'phase-indicator phase-walk';
      }
    }

    // Boucle d'intervalle
    function tick() {
      // Déclencher le décompte de 5 secondes exactement quand il reste 5 secondes
      if (timeLeft === 5 && !countdownTriggered) {
        playDecompte();
        countdownTriggered = true;
      }

      if (timeLeft <= 0) {
        // Changement de phase : La cloche sonne à t = 0
        playCloche();

        // Bascule entre Course et Marche
        if (currentPhase === 'RUN') {
          currentPhase = 'WALK';
          timeLeft = DURATION_WALK;
        } else {
          currentPhase = 'RUN';
          timeLeft = DURATION_RUN;
        }

        countdownTriggered = false;
        updateUI();
        return;
      }

      timeLeft--;
      updateUI();
    }

    // Démarrage de l'entraînement
    async function startTimer() {
      await initAudio();
      await requestWakeLock();

      btnStart.style.display = 'none';
      btnReset.style.display = 'inline-block';

      countdownTriggered = false;
      timerInterval = setInterval(tick, 1000);
    }

    // Arrêt / Réinitialisation
    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      releaseWakeLock();

      currentPhase = 'RUN';
      timeLeft = DURATION_RUN;
      countdownTriggered = false;

      btnStart.style.display = 'inline-block';
      btnReset.style.display = 'none';

      updateUI();
    }

    // Événements boutons
    btnStart.addEventListener('click', startTimer);
    btnReset.addEventListener('click', resetTimer);

    // Initialisation affichage
    updateUI();
  </script>
</body>
</html>
