<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application d'Intervalles - Jogging</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-run: #ff5252;
      --accent-walk: #4caf50;
      --text-color: #ffffff;
      --subtext-color: #b0b0b0;
      --input-bg: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      color: var(--subtext-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--subtext-color);
      font-weight: 600;
    }

    .input-group input {
      background-color: var(--input-bg);
      border: 1px solid #444;
      border-radius: 8px;
      color: var(--text-color);
      padding: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }

    .input-group input:focus {
      outline: none;
      border-color: #888;
    }

    .timer-display {
      font-size: 4.5rem;
      font-weight: bold;
      margin: 0.5rem 0;
      font-variant-numeric: tabular-nums;
    }

    .phase-indicator {
      font-size: 1.8rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
    }

    .phase-run {
      color: var(--accent-run);
      background-color: rgba(255, 82, 82, 0.15);
    }

    .phase-walk {
      color: var(--accent-walk);
      background-color: rgba(76, 175, 80, 0.15);
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 1.5rem;
      justify-content: center;
    }

    button {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
    }

    button:active {
      transform: scale(0.96);
    }

    button.btn-primary {
      background-color: #388e3c;
    }

    button.btn-stop {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Entraînement d'Intervalles</h1>

    <div class="settings-grid" id="settingsContainer">
      <div class="input-group">
        <label for="inputRun">Course (sec)</label>
        <input type="number" id="inputRun" min="5" value="30">
      </div>
      <div class="input-group">
        <label for="inputWalk">Marche (sec)</label>
        <input type="number" id="inputWalk" min="5" value="30">
      </div>
    </div>

    <div id="phaseDisplay" class="phase-indicator phase-run">Course</div>
    <div id="timerDisplay" class="timer-display">00:30</div>

    <div class="controls">
      <button id="btnStart" class="btn-primary">Démarrer</button>
      <button id="btnReset" class="btn-stop" style="display: none;">Arrêter</button>
    </div>
  </div>

  <script>
    // Fichiers sons
    const audioCloche = new Audio('cloche.wav');
    const audioDecompte = new Audio('decompte_5s.wav');

    // Récupération des réglages sauvegardés
    let durationRun = parseInt(localStorage.getItem('durationRun')) || 30;
    let durationWalk = parseInt(localStorage.getItem('durationWalk')) || 30;

    let currentPhase = 'RUN'; 
    let timeLeft = durationRun;
    let timerInterval = null;
    let wakeLock = null;
    let countdownTriggered = false;

    // Éléments du DOM
    const inputRun = document.getElementById('inputRun');
    const inputWalk = document.getElementById('inputWalk');
    const settingsContainer = document.getElementById('settingsContainer');
    const timerDisplay = document.getElementById('timerDisplay');
    const phaseDisplay = document.getElementById('phaseDisplay');
    const btnStart = document.getElementById('btnStart');
    const btnReset = document.getElementById('btnReset');

    inputRun.value = durationRun;
    inputWalk.value = durationWalk;

    // Synthèse vocale native pour les annonces de début et de transition
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        window.speechSynthesis.speak(utterance);
      }
    }

    function playCloche() {
      audioCloche.currentTime = 0;
      audioCloche.play().catch(err => console.warn("Erreur lecture cloche:", err));
    }

    function playDecompte() {
      audioDecompte.currentTime = 0;
      audioDecompte.play().catch(err => console.warn("Erreur lecture décompte:", err));
    }

    // Gestion de l'écran allumé
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock non disponible :', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateUI() {
      timerDisplay.textContent = formatTime(timeLeft);
      if (currentPhase === 'RUN') {
        phaseDisplay.textContent = 'Course';
        phaseDisplay.className = 'phase-indicator phase-run';
      } else {
        phaseDisplay.textContent = 'Marche';
        phaseDisplay.className = 'phase-indicator phase-walk';
      }
    }

    function tick() {
      // Remplace le décompte vocal par le déclenchement unique de decompte_5s.wav
      if (timeLeft === 5 && !countdownTriggered) {
        playDecompte();
        countdownTriggered = true;
      }

      if (timeLeft <= 0) {
        playCloche();

        if (currentPhase === 'RUN') {
          currentPhase = 'WALK';
          timeLeft = durationWalk;
          speak("Marche");
        } else {
          currentPhase = 'RUN';
          timeLeft = durationRun;
          speak("Course");
        }

        countdownTriggered = false;
        updateUI();
        return;
      }

      timeLeft--;
      updateUI();
    }

    async function startTimer() {
      audioCloche.load();
      audioDecompte.load();

      durationRun = Math.max(5, parseInt(inputRun.value) || 30);
      durationWalk = Math.max(5, parseInt(inputWalk.value) || 30);

      localStorage.setItem('durationRun', durationRun);
      localStorage.setItem('durationWalk', durationWalk);

      await requestWakeLock();

      settingsContainer.style.display = 'none';
      btnStart.style.display = 'none';
      btnReset.style.display = 'inline-block';

      currentPhase = 'RUN';
      timeLeft = durationRun;
      countdownTriggered = false;

      updateUI();
      playCloche();
      speak("C'est parti, course");

      timerInterval = setInterval(tick, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      releaseWakeLock();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      audioCloche.pause();
      audioDecompte.pause();

      currentPhase = 'RUN';
      timeLeft = durationRun;
      countdownTriggered = false;

      settingsContainer.style.display = 'grid';
      btnStart.style.display = 'inline-block';
      btnReset.style.display = 'none';

      updateUI();
    }

    inputRun.addEventListener('change', () => {
      durationRun = Math.max(5, parseInt(inputRun.value) || 30);
      if (!timerInterval && currentPhase === 'RUN') {
        timeLeft = durationRun;
        updateUI();
      }
    });

    inputWalk.addEventListener('change', () => {
      durationWalk = Math.max(5, parseInt(inputWalk.value) || 30);
      if (!timerInterval && currentPhase === 'WALK') {
        timeLeft = durationWalk;
        updateUI();
      }
    });

    btnStart.addEventListener('click', startTimer);
    btnReset.addEventListener('click', resetTimer);

    updateUI();
  </script>
</body>
</html>
