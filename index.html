<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Intervalles - Jogging</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-warmup: #ffb74d;
      --accent-run: #ff5252;
      --accent-walk: #4caf50;
      --text-color: #ffffff;
      --subtext-color: #b0b0b0;
      --input-bg: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: var(--text-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .total-time {
      font-size: 1rem;
      color: var(--subtext-color);
      margin-bottom: 1.5rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--subtext-color);
      font-weight: 600;
      text-align: center;
    }

    .input-group input {
      background-color: var(--input-bg);
      border: 1px solid #444;
      border-radius: 8px;
      color: var(--text-color);
      padding: 8px;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
    }

    .input-group input:focus {
      outline: none;
      border-color: #888;
    }

    .timer-display {
      font-size: 4.5rem;
      font-weight: bold;
      margin: 0.5rem 0;
      font-variant-numeric: tabular-nums;
    }

    .phase-indicator {
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
    }

    .phase-warmup { color: var(--accent-warmup); background-color: rgba(255, 183, 77, 0.15); }
    .phase-run { color: var(--accent-run); background-color: rgba(255, 82, 82, 0.15); }
    .phase-walk { color: var(--accent-walk); background-color: rgba(76, 175, 80, 0.15); }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 1.5rem;
      justify-content: center;
    }

    button {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
    }
    button.btn-primary { background-color: #388e3c; }
    button.btn-stop { background-color: #d32f2f; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🏃 Entraînement</h1>
    <div class="total-time" id="totalTimeDisplay">Temps total : 00:00</div>

    <div class="settings-grid" id="settingsContainer">
      <div class="input-group">
        <label for="inputWarmup">Échauff. (s)</label>
        <input type="number" id="inputWarmup" min="5" value="300">
      </div>
      <div class="input-group">
        <label for="inputRun">Course (s)</label>
        <input type="number" id="inputRun" min="5" value="60">
      </div>
      <div class="input-group">
        <label for="inputWalk">Marche (s)</label>
        <input type="number" id="inputWalk" min="5" value="60">
      </div>
    </div>

    <div id="phaseDisplay" class="phase-indicator phase-warmup">Échauffement</div>
    <div id="timerDisplay" class="timer-display">05:00</div>

    <div class="controls">
      <button id="btnStart" class="btn-primary">Démarrer</button>
      <button id="btnReset" class="btn-stop" style="display: none;">Arrêter</button>
    </div>
  </div>

  <script>
    // Audio
    const audioCloche = new Audio('cloche.wav');
    const audioDecompte = new Audio('decompte_5s.wav');

    // Récupération des réglages
    let durationWarmup = parseInt(localStorage.getItem('durationWarmup')) || 300;
    let durationRun = parseInt(localStorage.getItem('durationRun')) || 60;
    let durationWalk = parseInt(localStorage.getItem('durationWalk')) || 60;

    let currentPhase = 'WARMUP'; 
    let timeLeft = durationWarmup;
    let totalTimeElapsed = 0;
    
    let timerInterval = null;
    let wakeLock = null;
    let countdownTriggered = false;

    const inputWarmup = document.getElementById('inputWarmup');
    const inputRun = document.getElementById('inputRun');
    const inputWalk = document.getElementById('inputWalk');
    
    const settingsContainer = document.getElementById('settingsContainer');
    const timerDisplay = document.getElementById('timerDisplay');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const phaseDisplay = document.getElementById('phaseDisplay');
    const btnStart = document.getElementById('btnStart');
    const btnReset = document.getElementById('btnReset');

    inputWarmup.value = durationWarmup;
    inputRun.value = durationRun;
    inputWalk.value = durationWalk;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        window.speechSynthesis.speak(utterance);
      }
    }
    
    function formatTimeToSpeech(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      let text = "";
      
      if (m > 0) {
        text += m + (m === 1 ? " minute" : " minutes");
      }
      if (m > 0 && s > 0) {
        text += " et ";
      }
      if (s > 0) {
        text += s + (s === 1 ? " seconde" : " secondes");
      }
      return text;
    }

    function playCloche() {
      audioCloche.currentTime = 0;
      audioCloche.play().catch(err => console.warn("Erreur cloche:", err));
    }

    function playDecompte() {
      audioDecompte.currentTime = 0;
      audioDecompte.play().catch(err => console.warn("Erreur décompte:", err));
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock non dispo:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateUI() {
      timerDisplay.textContent = formatTime(timeLeft);
      totalTimeDisplay.textContent = `Temps total : ${formatTime(totalTimeElapsed)}`;
      
      if (currentPhase === 'WARMUP') {
        phaseDisplay.textContent = 'Échauffement';
        phaseDisplay.className = 'phase-indicator phase-warmup';
      } else if (currentPhase === 'RUN') {
        phaseDisplay.textContent = 'Course';
        phaseDisplay.className = 'phase-indicator phase-run';
      } else {
        phaseDisplay.textContent = 'Marche';
        phaseDisplay.className = 'phase-indicator phase-walk';
      }
    }

    function tick() {
      totalTimeElapsed++;

      // Décompte Spotify-friendly
      if (timeLeft === 5 && !countdownTriggered) {
        playDecompte();
        countdownTriggered = true;
      }

      // Rappels vocaux du temps restant
      if (timeLeft > 5) {
        if (currentPhase === 'WARMUP' && timeLeft % 60 === 0) {
          speak("Il reste " + formatTimeToSpeech(timeLeft));
        } else if (currentPhase === 'WALK' && timeLeft % 30 === 0) {
          speak("Il reste " + formatTimeToSpeech(timeLeft));
        } else if (currentPhase === 'RUN' && timeLeft % 15 === 0) {
          speak("Il reste " + formatTimeToSpeech(timeLeft));
        }
      }

      // Changement de phase
      if (timeLeft <= 0) {
        playCloche();
        countdownTriggered = false;

        if (currentPhase === 'WARMUP' || currentPhase === 'WALK') {
          currentPhase = 'RUN';
          timeLeft = durationRun;
          speak("Course, " + formatTimeToSpeech(durationRun));
        } else if (currentPhase === 'RUN') {
          currentPhase = 'WALK';
          timeLeft = durationWalk;
          speak("Marche, " + formatTimeToSpeech(durationWalk));
        }

        updateUI();
        return;
      }

      timeLeft--;
      updateUI();
    }

    async function startTimer() {
      // 1. Charger les audios sur le clic
      audioCloche.load();
      audioDecompte.load();

      durationWarmup = Math.max(5, parseInt(inputWarmup.value) || 300);
      durationRun = Math.max(5, parseInt(inputRun.value) || 60);
      durationWalk = Math.max(5, parseInt(inputWalk.value) || 60);

      // 2. PARLER TOUT DE SUITE ! (Avant l'await)
      // Cela "débloque" la voix pour le système mobile de façon permanente
      speak("Échauffement, " + formatTimeToSpeech(durationWarmup));
      playCloche();

      // 3. Sauvegarder les paramètres
      localStorage.setItem('durationWarmup', durationWarmup);
      localStorage.setItem('durationRun', durationRun);
      localStorage.setItem('durationWalk', durationWalk);

      // 4. Mettre à jour l'interface
      settingsContainer.style.display = 'none';
      btnStart.style.display = 'none';
      btnReset.style.display = 'inline-block';

      currentPhase = 'WARMUP';
      timeLeft = durationWarmup;
      totalTimeElapsed = 0;
      countdownTriggered = false;

      updateUI();
      
      // 5. SEULEMENT ENSUITE, demander le Wake Lock qui est asynchrone (await)
      await requestWakeLock();

      timerInterval = setInterval(tick, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      releaseWakeLock();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      audioCloche.pause();
      audioDecompte.pause();

      currentPhase = 'WARMUP';
      timeLeft = durationWarmup;
      totalTimeElapsed = 0;
      countdownTriggered = false;

      settingsContainer.style.display = 'grid';
      btnStart.style.display = 'inline-block';
      btnReset.style.display = 'none';

      updateUI();
    }

    inputWarmup.addEventListener('change', () => {
      durationWarmup = Math.max(5, parseInt(inputWarmup.value) || 300);
      if (!timerInterval && currentPhase === 'WARMUP') {
        timeLeft = durationWarmup;
        updateUI();
      }
    });

    btnStart.addEventListener('click', startTimer);
    btnReset.addEventListener('click', resetTimer);

    updateUI();
  </script>
</body>
</html>
