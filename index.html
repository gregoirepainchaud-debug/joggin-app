<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Intervalles - Jogging</title>

  <link rel="apple-touch-icon" href="IconeCoureur.png">
  <link rel="icon" type="image/png" href="IconeCoureur.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jogging">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-warmup: #ffb74d;
      --accent-run: #ff5252;
      --accent-walk: #4caf50;
      --text-color: #ffffff;
      --subtext-color: #b0b0b0;
      --input-bg: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
      box-sizing: border-box;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }

    .app-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 6px;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
      color: var(--text-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .total-time {
      font-size: 1rem;
      color: var(--subtext-color);
      margin-bottom: 1.5rem;
    }

    .settings-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 220px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--subtext-color);
      font-weight: 600;
      text-align: center;
    }

    .input-group input {
      background-color: var(--input-bg);
      border: 1px solid #444;
      border-radius: 8px;
      color: var(--text-color);
      padding: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .input-group input:focus {
      outline: none;
      border-color: #888;
    }

    .timer-display {
      font-size: 4rem;
      font-weight: bold;
      margin: 0.5rem 0;
      font-variant-numeric: tabular-nums;
    }

    .phase-indicator {
      font-size: 1.3rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
      max-width: 100%;
      box-sizing: border-box;
    }

    .phase-warmup { color: var(--accent-warmup); background-color: rgba(255, 183, 77, 0.15); }
    .phase-run { color: var(--accent-run); background-color: rgba(255, 82, 82, 0.15); }
    .phase-walk { color: var(--accent-walk); background-color: rgba(76, 175, 80, 0.15); }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 1.5rem;
      justify-content: center;
      width: 100%;
    }

    button {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      max-width: 250px;
      box-sizing: border-box;
    }
    button.btn-primary { background-color: #388e3c; }
    button.btn-stop { background-color: #d32f2f; }
  </style>
</head>
<body>

  <div class="card">
    <div class="app-header">
      <img src="IconeCoureur.png" alt="Icône Coureur" class="app-icon">
      <h1>Entraînement</h1>
    </div>
    <div class="total-time" id="totalTimeDisplay">Temps total : 00:00</div>

    <div class="settings-column" id="settingsContainer">
      <div class="input-group">
        <label for="inputWarmup">Échauffement (sec)</label>
        <input type="number" id="inputWarmup" min="5" value="300">
      </div>
      <div class="input-group">
        <label for="inputRun">Course (sec)</label>
        <input type="number" id="inputRun" min="5" value="60">
      </div>
      <div class="input-group">
        <label for="inputWalk">Marche (sec)</label>
        <input type="number" id="inputWalk" min="5" value="60">
      </div>
    </div>

    <div id="phaseDisplay" class="phase-indicator phase-warmup">Échauffement</div>
    <div id="timerDisplay" class="timer-display">05:00</div>

    <div class="controls">
      <button id="btnStart" class="btn-primary">Démarrer</button>
      <button id="btnReset" class="btn-stop" style="display: none;">Arrêter</button>
    </div>
  </div>

  <script>
    const audioCloche = new Audio('cloche.wav');
    const audioDecompte = new Audio('decompte_5s.wav');
    
    // Piste audio 100% silencieuse encodée en base64 pour forcer le maintien de la session Média (Ducking)
    const audioSilence = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
    audioSilence.loop = true;

    let durationWarmup = parseInt(localStorage.getItem('durationWarmup')) || 300;
    let durationRun = parseInt(localStorage.getItem('durationRun')) || 60;
    let durationWalk = parseInt(localStorage.getItem('durationWalk')) || 60;

    let currentPhase = 'WARMUP'; 
    let timeLeft = durationWarmup;
    let totalTimeElapsed = 0;
    
    let timerInterval = null;
    let wakeLock = null;
    let countdownTriggered = false;
    let qcVoice = null; 

    const inputWarmup = document.getElementById('inputWarmup');
    const inputRun = document.getElementById('inputRun');
    const inputWalk = document.getElementById('inputWalk');
    
    const settingsContainer = document.getElementById('settingsContainer');
    const timerDisplay = document.getElementById('timerDisplay');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const phaseDisplay = document.getElementById('phaseDisplay');
    const btnStart = document.getElementById('btnStart');
    const btnReset = document.getElementById('btnReset');

    inputWarmup.value = durationWarmup;
    inputRun.value = durationRun;
    inputWalk.value = durationWalk;

    function setVoice() {
      const voices = window.speechSynthesis.getVoices();
      qcVoice = voices.find(v => v.lang === 'fr-CA' && v.name.includes('Amélie')) 
             || voices.find(v => v.lang === 'fr-CA' && (v.name.includes('female') || v.name.includes('Female')))
             || voices.find(v => v.lang === 'fr-CA')
             || voices.find(v => v.lang.startsWith('fr') && (v.name.includes('female') || v.name.includes('Female')))
             || voices.find(v => v.lang.startsWith('fr'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = setVoice;
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        // La fonction cancel() a été RETIRÉE car elle provoque le plantage de Spotify.
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-CA'; 
        if (!qcVoice) setVoice();
        if (qcVoice) utterance.voice = qcVoice;
        
        window.speechSynthesis.speak(utterance);
      }
    }
    
    function formatDurationSpeech(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      let text = "";
      
      if (m > 0) text += m + (m === 1 ? " minute" : " minutes");
      if (m > 0 && s > 0) text += " et ";
      if (s > 0) text += s + (s === 1 ? " seconde" : " secondes");
      
      return text;
    }

    function formatTimeRemainingSpeech(seconds) {
      const text = formatDurationSpeech(seconds);
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      
      if ((m === 1 && s === 0) || (m === 0 && s === 1)) {
         return text + " restante";
      }
      return text + " restantes";
    }

    function playCloche() {
      audioCloche.currentTime = 0;
      audioCloche.play().catch(err => console.warn("Erreur cloche:", err));
    }

    function playDecompte() {
      audioDecompte.currentTime = 0;
      audioDecompte.play().catch(err => console.warn("Erreur décompte:", err));
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock non dispo:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateUI() {
      timerDisplay.textContent = formatTime(timeLeft);
      totalTimeDisplay.textContent = `Temps total : ${formatTime(totalTimeElapsed)}`;
      
      if (currentPhase === 'WARMUP') {
        phaseDisplay.textContent = 'Échauffement';
        phaseDisplay.className = 'phase-indicator phase-warmup';
      } else if (currentPhase === 'RUN') {
        phaseDisplay.textContent = 'Course';
        phaseDisplay.className = 'phase-indicator phase-run';
      } else {
        phaseDisplay.textContent = 'Marche';
        phaseDisplay.className = 'phase-indicator phase-walk';
      }
    }

    function tick() {
      totalTimeElapsed++;
      
      let nextTime = timeLeft - 1;

      if (nextTime === 5 && !countdownTriggered) {
        playDecompte();
        countdownTriggered = true;
      }

      if (nextTime > 5) {
        if (currentPhase === 'WARMUP' && nextTime % 60 === 0) {
          speak(formatTimeRemainingSpeech(nextTime));
        } else if (currentPhase === 'WALK' && nextTime % 30 === 0) {
          speak(formatTimeRemainingSpeech(nextTime));
        } else if (currentPhase === 'RUN' && nextTime % 15 === 0) {
          speak(formatTimeRemainingSpeech(nextTime));
        }
      }

      if (nextTime <= 0) {
        playCloche();
        countdownTriggered = false;

        if (currentPhase === 'WARMUP' || currentPhase === 'WALK') {
          currentPhase = 'RUN';
          timeLeft = durationRun;
          setTimeout(() => speak("Course " + formatDurationSpeech(durationRun)), 1000);
        } else if (currentPhase === 'RUN') {
          currentPhase = 'WALK';
          timeLeft = durationWalk;
          setTimeout(() => speak("Marche " + formatDurationSpeech(durationWalk)), 1000);
        }
        
        updateUI();
        return;
      }

      timeLeft--;
      updateUI();
    }

    async function startTimer() {
      audioCloche.load();
      audioDecompte.load();

      // On lance la boucle de silence en arrière-plan pour monopoliser le canal média
      audioSilence.play().catch(e => console.warn("Impossible de jouer le silence:", e));

      if ('speechSynthesis' in window) {
         window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      }

      durationWarmup = Math.max(5, parseInt(inputWarmup.value) || 300);
      durationRun = Math.max(5, parseInt(inputRun.value) || 60);
      durationWalk = Math.max(5, parseInt(inputWalk.value) || 60);

      localStorage.setItem('durationWarmup', durationWarmup);
      localStorage.setItem('durationRun', durationRun);
      localStorage.setItem('durationWalk', durationWalk);

      settingsContainer.style.display = 'none';
      btnStart.style.display = 'none';
      btnReset.style.display = 'inline-block';

      currentPhase = 'WARMUP';
      timeLeft = durationWarmup;
      totalTimeElapsed = 0;
      countdownTriggered = false;

      updateUI();
      
      playCloche();
      setTimeout(() => speak("Échauffement " + formatDurationSpeech(durationWarmup)), 1000);

      await requestWakeLock();
      timerInterval = setInterval(tick, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      releaseWakeLock();

      audioSilence.pause(); // On arrête le silence quand l'entraînement est fini
      audioCloche.pause();
      audioDecompte.pause();

      currentPhase = 'WARMUP';
      timeLeft = durationWarmup;
      totalTimeElapsed = 0;
      countdownTriggered = false;

      settingsContainer.style.display = 'flex';
      btnStart.style.display = 'inline-block';
      btnReset.style.display = 'none';

      updateUI();
    }

    inputWarmup.addEventListener('change', () => {
      durationWarmup = Math.max(5, parseInt(inputWarmup.value) || 300);
      if (!timerInterval && currentPhase === 'WARMUP') {
        timeLeft = durationWarmup;
        updateUI();
      }
    });

    btnStart.addEventListener('click', startTimer);
    btnReset.addEventListener('click', resetTimer);

    updateUI();
  </script>
</body>
</html>
